repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.6.0
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
    rev: v0.9.6
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
   # Mypy to check type annotations
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        name: Mypy Type Checker (backend)
        args: [--ignore-missing-imports, --disable-error-code=import-untyped]
        stages: [pre-commit]